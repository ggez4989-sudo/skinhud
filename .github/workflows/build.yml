name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Rozpakuj i uloz pliki
        run: |
          unzip -o skinhud-telefon.zip
          mkdir -p src/main/java/pl/skinhud src/main/resources/assets/skinhud/lang
          cp SkinHudClient.java CheatModules.java ModuleMenuScreen.java src/main/java/pl/skinhud/
          cp fabric.mod.json src/main/resources/
          cp en_us.json src/main/resources/assets/skinhud/lang/
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: skinhud-jar
          path: build/libs/skinhud-1.0.0.jar
